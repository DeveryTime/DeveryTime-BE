name: Deploy Backend to EC2

on:
  push:
    branches:
      - develop

concurrency:
  group: deverytime-develop-deploy
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}

          JWT_SECRET: ${{ secrets.JWT_SECRET }}

          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

        run: ./gradlew clean build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Upload JAR to S3
        run: |
          set -e

          JAR_FILE=$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-plain.jar" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "JAR 파일을 찾을 수 없습니다."
            exit 1
          fi

          aws s3 cp "$JAR_FILE" \
            "s3://deverytime-deploy-091914202048/${{ github.sha }}.jar"

      - name: Deploy to EC2
        run: |
          set -e

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-05ddb126c6dbacca1" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "mkdir -p /opt/deverytime",
              "aws s3 cp s3://deverytime-deploy-091914202048/${{ github.sha }}.jar /opt/deverytime/deverytime.jar",
              "systemctl restart deverytime"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-05ddb126c6dbacca1"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-05ddb126c6dbacca1"